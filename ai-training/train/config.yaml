# Prime 0.2 — LoRA fine-tuning config for Llama 3.1 8B on Apple Silicon
# Run: bash train/train.sh

# Base model — 8B 4-bit quantized (fits in 16GB RAM)
model: mlx-community/Meta-Llama-3.1-8B-Instruct-4bit
train: true

# Dataset directory (must contain train.jsonl and valid.jsonl)
data: data

# Reproducibility
seed: 42

# LoRA
lora_layers: 16
lora_rank: 8
lora_scale: 20.0
lora_dropout: 0.05

# Training
batch_size: 2
iters: 2000
val_batches: 10
learning_rate: 1e-5
steps_per_report: 50
steps_per_eval: 200
save_every: 400
adapter_path: train/adapters
max_seq_length: 2048

# LR schedule
lr_schedule:
  name: cosine_decay
  warmup: 50
  arguments: [1e-5, 2000, 1e-6]

