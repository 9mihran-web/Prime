# ---------------------------------------------------------------------------
# Alembic configuration for PRIME backend
# ---------------------------------------------------------------------------

[alembic]
# Path to migration scripts
script_location = alembic

# Template for new migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for the timestamp in generated file names
timezone = UTC

# Maximum length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to "true" to run the environment during the "revision" command
revision_environment = false

# Set to "true" to allow .pyc and .pyo file revisions
sourceless = false

# Version location — relative to the script_location
version_locations = %(here)s/alembic/versions

# The output encoding used when revision files are written
output_encoding = utf-8

# ---------------------------------------------------------------------------
# Database URL
# Overridden at runtime in alembic/env.py from the app settings,
# so this value is only a fallback for when alembic CLI is called directly.
# ---------------------------------------------------------------------------
sqlalchemy.url = postgresql+asyncpg://prime:changeme@localhost:5432/prime_db

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
